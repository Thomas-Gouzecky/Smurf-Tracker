[project]
name = "outbox"
version = "0.1.0"
description = "A Python library for managing outbox patterns in distributed systems."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "sqlmodel>=0.0.48",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"