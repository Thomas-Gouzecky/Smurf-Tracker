services:
  auth-service:
    image: tomcheese/auth-service:latest
    container_name: auth-service
    ports:
      - '8080:8080'
    env_file:
      - .env
    healthcheck:
      test: ['CMD-SHELL', 'curl -f https://localhost:8080/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - '${USERPROFILE}/.aspnet/https:/https:ro'
    networks:
      - smurftracker_network

networks:
  smurftracker_network:
    driver: bridge
