services:
  kafka:
    image: apache/kafka:4.3.2
    container_name: kafka
    hostname: kafka
    restart: unless-stopped

    ports:
      - '9092:9092'

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list > /dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    environment:
      # KRaft configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,DOCKER://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER

      # Development settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - smurftracker_network

  debezium:
    image: quay.io/debezium/connect:3.5
    container_name: debezium
    hostname: debezium
    restart: unless-stopped
    depends_on:
      - kafka

    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://debezium:8083/connectors || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    ports:
      - '8083:8083'

    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1

      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status

      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    networks:
      - smurftracker_network

  setup-connectors:
    image: curlimages/curl:8.3.1
    container_name: setup-connectors
    restart: 'no'

    depends_on:
      - debezium

    volumes:
      - ./connectors:/connectors:ro
      - ./scripts/setup-connectors.sh:/setup-connectors.sh:ro

    entrypoint: ['/bin/sh', '/setup-connectors.sh']

    networks:
      - smurftracker_network
volumes:
  kafka-data:
    name: kafka-data
networks:
  smurftracker_network:
    driver: bridge
