services:
  postgres:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smurftracker
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - smurftracker_network

  auth-migrations:
    build:
      context: ../../apps/auth
      dockerfile: Dockerfile.migrations
    container_name: auth-migrations
    command: ['--migrate']
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=smurftracker;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smurftracker_network
volumes:
  postgres_data:
    driver: local
networks:
  smurftracker_network:
    driver: bridge
