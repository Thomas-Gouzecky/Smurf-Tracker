name: Build Docker Images

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: auth-service
            context: apps/auth
            dockerfile: apps/auth/Dockerfile.app
            version_type: dotnet
            version_file: apps/auth/auth.csproj
          - image: auth-migrations
            context: apps/auth
            dockerfile: apps/auth/Dockerfile.migrations
            version_type: dotnet
            version_file: apps/auth/auth.csproj
          - image: smurftracker-api-gateway
            context: apps/api-gateway
            dockerfile: apps/api-gateway/Dockerfile
            version_type: dotnet
            version_file: apps/api-gateway/ApiGateway.csproj

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Python Version
        id: get_python_version
        if: matrix.version_type == 'python'
        shell: bash
        run: |
          version=$(python -c "
          import tomllib
          with open('${{ matrix.version_file }}', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")

          echo "Version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Get .NET Version
        id: get_dotnet_version
        if: matrix.version_type == 'dotnet'
        shell: pwsh
        run: |
          $version = Select-Xml -Path ${{ matrix.version_file }} -XPath "//Version" |
            Select-Object -ExpandProperty Node |
            Select-Object -ExpandProperty InnerText |
            ForEach-Object { $_.Trim() }

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "No version was found in ${{ matrix.version_file }}"
          }

          echo "Version: $version"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ steps.get_dotnet_version.outputs.version || steps.get_python_version.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
